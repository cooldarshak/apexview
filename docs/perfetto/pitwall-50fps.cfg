# Android 10+ Perfetto textproto. Use with `adb shell perfetto --txt -c - ...`.
# This is a 60s *system* capture, not a synthetic frame-rate measurement.
# The prior 64MiB scheduler buffer preserved only ~21s of a 60s S22 capture.
# Keep enough history to compare warmup and steady-state frame timelines.
# On memory-constrained TV devices reduce duration before shrinking this buffer.
buffers { size_kb: 196608 fill_policy: RING_BUFFER }
buffers { size_kb: 32768 fill_policy: RING_BUFFER }
data_sources {
  config {
    name: "linux.ftrace"
    target_buffer: 0
    ftrace_config {
      ftrace_events: "sched/sched_switch"
      ftrace_events: "sched/sched_waking"
      ftrace_events: "power/cpu_frequency"
      ftrace_events: "power/cpu_idle"
      ftrace_events: "binder/binder_transaction"
      atrace_categories: "gfx"
      atrace_categories: "view"
      atrace_categories: "wm"
      atrace_categories: "am"
      atrace_categories: "video"
      atrace_categories: "dalvik"
      atrace_categories: "freq"
      atrace_categories: "sched"
      atrace_apps: "app.apexview_custom"
    }
  }
}
data_sources { config { name: "android.surfaceflinger.frametimeline" target_buffer: 1 } }
data_sources { config { name: "android.surfaceflinger.layers" target_buffer: 1 } }
data_sources { config { name: "android.log" target_buffer: 1 android_log_config {
  log_ids: LID_MAIN
  log_ids: LID_SYSTEM
} } }
duration_ms: 60000
flush_period_ms: 10000
write_into_file: true
file_write_period_ms: 5000
max_file_size_bytes: 402653184
