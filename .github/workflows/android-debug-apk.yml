name: Android debug APK

on:
  push:
    branches:
      - feature/playback-speed-tv-controls
      - feature/timing-tower-map-menu
      - fix/tv-timing-map-and-dpad-sliders
      - customtiledview
      - feature/hevc-stitching-poc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 35 SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install FFmpeg tools for synthetic HEVC fixtures
        timeout-minutes: 6
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Languages=none -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y ffmpeg
          ffmpeg -hide_banner -decoders 2>&1 | grep -q hevc
      - name: Build Kvazaar HEVC encoder with tile support
        timeout-minutes: 15
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --no-install-recommends -y automake autoconf libtool pkg-config build-essential yasm
          git clone --depth 1 https://github.com/ultravideo/kvazaar.git "$RUNNER_TEMP/kvazaar"
          cd "$RUNNER_TEMP/kvazaar"
          ./autogen.sh
          ./configure --prefix=/usr/local
          make -j2
          sudo make install
          sudo ldconfig
          kvazaar --version

      - name: Generate and validate synthetic HEVC feed pair
        run: |
          FIXTURE_DIR="$RUNNER_TEMP/apexview-hevc-fixtures"
          mkdir -p "$FIXTURE_DIR"
          python3 tools/generate_hevc_fixtures.py --output-dir "$FIXTURE_DIR"
          echo "APEXVIEW_HEVC_FIXTURE_DIR=$FIXTURE_DIR" >> "$GITHUB_ENV"

      - name: Generate genuine synthetic HEVC tile feeds
        run: |
          TILE_FIXTURE_DIR="$RUNNER_TEMP/apexview-hevc-tile-fixtures"
          mkdir -p "$TILE_FIXTURE_DIR"
          python3 tools/generate_hevc_tile_fixtures.py --output-dir "$TILE_FIXTURE_DIR"
          echo "APEXVIEW_HEVC_TILE_FIXTURE_DIR=$TILE_FIXTURE_DIR" >> "$GITHUB_ENV"

      - name: Generate four-tile 2x2 HEVC feeds and one-decoder sample
        run: |
          TILE_FIXTURE_DIR="$RUNNER_TEMP/apexview-hevc-tile-fixtures"
          python3 tools/generate_hevc_tile_2x2_fixtures.py --output-dir "$TILE_FIXTURE_DIR"
          echo "APEXVIEW_HEVC_TILE_FIXTURE_DIR=$TILE_FIXTURE_DIR" >> "$GITHUB_ENV"

      - name: Run unit tests, including Kotlin analysis of real synthetic feeds
        run: |
          set +e
          OUTPUT_PARAMETER_DIR="$RUNNER_TEMP/apexview-hevc-output-parameters"
          mkdir -p "$OUTPUT_PARAMETER_DIR"
          export APEXVIEW_HEVC_OUTPUT_PARAMETER_DIR="$OUTPUT_PARAMETER_DIR"
          echo "APEXVIEW_HEVC_OUTPUT_PARAMETER_DIR=$OUTPUT_PARAMETER_DIR" >> "$GITHUB_ENV"
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest
          TEST_STATUS=$?
          if [ "$TEST_STATUS" -ne 0 ]; then
            echo "::group::Detailed JVM unit-test failures"
            python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          for path in glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"):
              root = ET.parse(path).getroot()
              for case in root.findall(".//testcase"):
                  failure = case.find("failure")
                  error = case.find("error")
                  issue = failure if failure is not None else error
                  if issue is not None:
                      print(f"FAILED: {case.get('classname')}.{case.get('name')}")
                      print(issue.get("message", ""))
                      print(issue.text or "")
          PY
            echo "::endgroup::"
          fi
          exit "$TEST_STATUS"

      - name: Independently decode generated output parameter sets and re-identified feeds
        run: |
          python3 tools/validate_hevc_output_parameters.py \
            --source-dir "$RUNNER_TEMP/apexview-hevc-fixtures" \
            --tile-dir "$RUNNER_TEMP/apexview-hevc-tile-fixtures" \
            --output-dir "$RUNNER_TEMP/apexview-hevc-output-parameters"


      - name: Independently decode Tizen-style 2x1 composition and compare source pixels
        run: |
          python3 tools/validate_hevc_tizen_grid_composer.py \
            --fixture-dir "$RUNNER_TEMP/apexview-hevc-fixtures" \
            --output-dir "$RUNNER_TEMP/apexview-hevc-output-parameters"

      # This repository must sign every distributable APK with the same private key. Do not
      # fall back to the ephemeral debug.keystore on a hosted runner: Android will reject updates.
      - name: Independently decode clear HEVC CMAF init and media fragments
        run: |
          python3 tools/validate_hevc_clear_cmaf.py \
            --fixture-dir "$RUNNER_TEMP/apexview-hevc-tile-fixtures" \
            --output-dir "$RUNNER_TEMP/apexview-hevc-output-parameters"

      - name: Independently decode Tizen-style CMAF grid composition and compare hstack pixels
        run: |
          python3 tools/validate_hevc_cmaf_grid.py \
            --fixture-dir "$RUNNER_TEMP/apexview-hevc-fixtures" \
            --output-dir "$RUNNER_TEMP/apexview-hevc-output-parameters"

      - name: Stage composed clear CMAF for Media3 device instrumentation
        run: |
          set -euo pipefail
          TILE_FIXTURE_DIR="$RUNNER_TEMP/apexview-hevc-tile-fixtures"
          OUTPUT_PARAMETER_DIR="$RUNNER_TEMP/apexview-hevc-output-parameters"
          test -s "$OUTPUT_PARAMETER_DIR/hevc_tizen_cmaf_grid.mp4"
          test -s "$OUTPUT_PARAMETER_DIR/hevc_tizen_cmaf_grid.mpd"
          cp "$OUTPUT_PARAMETER_DIR/hevc_tizen_cmaf_grid.mp4" "$TILE_FIXTURE_DIR/hevc_tizen_cmaf_grid.mp4"
          ls -lh "$TILE_FIXTURE_DIR/hevc_tizen_cmaf_grid.mp4"

      - name: Configure persistent APK signing
        id: apk_signing
        env:
          APK_SIGNING_KEYSTORE_BASE64: ${{ secrets.APK_SIGNING_KEYSTORE_BASE64 }}
          APK_SIGNING_STORE_PASSWORD: ${{ secrets.APK_SIGNING_STORE_PASSWORD }}
          APK_SIGNING_KEY_ALIAS: ${{ secrets.APK_SIGNING_KEY_ALIAS }}
          APK_SIGNING_KEY_PASSWORD: ${{ secrets.APK_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APK_SIGNING_KEYSTORE_BASE64 APK_SIGNING_STORE_PASSWORD APK_SIGNING_KEY_ALIAS APK_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "APK_SIGNING_READY=false" >> "$GITHUB_ENV"
              echo "::warning::Missing repository Actions secret: $name. Tests and compilation will run, but no distributable APK will be uploaded."
              echo "Add the four APK_SIGNING_* repository secrets, then dispatch this workflow to create an updateable APK." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/apexview-update-key.p12"
          printf '%s' "$APK_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          cat > keystore.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$APK_SIGNING_STORE_PASSWORD
          keyAlias=$APK_SIGNING_KEY_ALIAS
          keyPassword=$APK_SIGNING_KEY_PASSWORD
          EOF
          echo "APK_SIGNING_READY=true" >> "$GITHUB_ENV"
          echo "Persistent APK signing key configured." >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble debug APK
        id: assemble_apks
        if: always() && !cancelled()
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Upload debug APK
        if: always() && steps.assemble_apks.outcome == 'success' && env.APK_SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apexview-custom-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload temporary POC debug APK for device proof
        if: always() && steps.assemble_apks.outcome == 'success' && env.APK_SIGNING_READY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apexview-hevc-single-decoder-base-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload single-decoder instrumentation APK
        if: always() && steps.assemble_apks.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: apexview-hevc-single-decoder-instrumentation
          path: app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload HEVC output parameter validation evidence
        if: always() && steps.assemble_apks.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: apexview-hevc-output-parameter-validation
          path: |
            ${{ runner.temp }}/apexview-hevc-output-parameters/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apexview-custom-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14
