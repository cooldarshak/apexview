name: Android debug APK

on:
  push:
    branches:
      - feature/playback-speed-tv-controls
      - feature/timing-tower-map-menu
      - fix/tv-timing-map-and-dpad-sliders
      - customtiledview
      - feature/hevc-stitching-poc
      - feature/continuous-baked-scene-cast
      - feature/per-feed-adaptive-hevc-quality
      - feature/pitwall-performance-audit-plan
      - feature/architecture-g-rust-stitching
    # Documentation-only changes must not spend an Android build run.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read # Read exact Build 843 baseline artifact for G.0 upgrade gate.

# One branch HEAD, one useful CI run. Pushing an updated HEAD cancels only the
# superseded run on that branch; a failed compiler/test never publishes an APK.
concurrency:
  group: pitwall-debug-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-24.04
    env:
      PITWALL_CAST_RECEIVER_ID: ${{ vars.PITWALL_CAST_RECEIVER_ID }}
    timeout-minutes: 60
    outputs:
      stage_name: ${{ steps.stage_g0.outputs.name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Enforce coordinated change contract before SDK/Gradle
        run: |
          python3 -m unittest discover -s scripts -p 'test_pitwall_change_contract.py' -v
          python3 scripts/pitwall_change_contract.py

      - name: Set up JDK 21 for Robolectric Android 16 tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Prepare Android 36 target platform and persistent APK-signing tools
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk"
          # sdkmanager's stable package index does not yet list android-37 on
          # these runners. AGP resolves compileSdk 37 through its Gradle-managed
          # platform installation. Validate the available target platform and
          # both signature tools here; the compile/AAR-metadata tasks are the
          # authoritative android-37 compile gate below.
          if [ ! -s "$sdk/platforms/android-36/android.jar" ] ||
             [ ! -x "$sdk/build-tools/35.0.0/apksigner" ] ||
             [ ! -x "$sdk/build-tools/36.0.0/apksigner" ]; then
            sdkmanager "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0"
          fi
          test -s "$sdk/platforms/android-36/android.jar"
          test -x "$sdk/build-tools/35.0.0/apksigner"
          test -x "$sdk/build-tools/36.0.0/apksigner"

      - name: Restore pinned cargo-ndk tool
        if: github.ref == 'refs/heads/feature/architecture-g-rust-stitching'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pitwall-cargo-ndk
          key: pitwall-cargo-ndk-v1-ubuntu24-${{ runner.arch }}-rust1.91.1-4.1.2

      - name: Architecture G.0 host kernel and Android ABI feasibility
        if: github.ref == 'refs/heads/feature/architecture-g-rust-stitching'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/pitwall-g0"
          mkdir -p "$report/fixtures"
          python3 scripts/test_architecture_g0_fixtures.py --generate "$report/fixtures"
          python3 scripts/test_architecture_g0_kernel_vectors.py --generate "$report/fixtures/kernel-vectors.txt"
          echo "PITWALL_G0_KERNEL_VECTORS=$report/fixtures/kernel-vectors.txt" >> "$GITHUB_ENV"
          echo "PITWALL_G0_FIXTURE_DIR=$report/fixtures" >> "$GITHUB_ENV"
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          export ANDROID_NDK_HOME="$sdk/ndk/28.2.13676358"
          if ! grep -Eq '^Pkg.Revision[[:space:]]*=[[:space:]]*28\.2\.13676358[[:space:]]*$' "$ANDROID_NDK_HOME/source.properties" 2>/dev/null ||
             [ ! -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
            sdkmanager "ndk;28.2.13676358"
          fi
          grep -Eq '^Pkg.Revision[[:space:]]*=[[:space:]]*28\.2\.13676358[[:space:]]*$' "$ANDROID_NDK_HOME/source.properties"
          test -x "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          cd native/architecture-g
          rustup toolchain install 1.91.1 --profile minimal --component rustfmt --component clippy --target aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          rustc -Vv > "$report/toolchain.txt"
          g++ --version >> "$report/toolchain.txt"
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          # Separate pinned host-only diagnostic toolchain; Android stays on 1.91.1.
          rustup toolchain install nightly-2025-11-15 --profile minimal
          RUSTFLAGS="-Zsanitizer=address" CARGO_TARGET_DIR="$RUNNER_TEMP/pitwall-ga-asan-target" \
            ASAN_OPTIONS="detect_leaks=1:halt_on_error=1:exitcode=98" LSAN_OPTIONS="exitcode=98" \
            cargo +nightly-2025-11-15 test --locked --lib --target x86_64-unknown-linux-gnu -- --test-threads=1 2>&1 | tee "$report/ga-asan-lsan.txt"
          cargo build --locked --release --bins
          target/release/feasibility_bench "$report/fixtures/kernel-vectors.txt" | tee "$report/kernel-host.txt"
          g++ -std=c++17 -O3 -Wall -Wextra control.cpp -o "$report/control"
          while read -r file prefix expected hash; do
            printf '%s  %s\n' "$hash" "$report/fixtures/$file" | sha256sum -c -
            target/release/bench "$report/fixtures/$file" "$prefix" "$expected" | tee -a "$report/host.txt"
            "$report/control" "$report/fixtures/$file" "$prefix" "$expected" | tee -a "$report/host.txt"
          done < "$report/fixtures/manifest.txt"
          tool_root="$RUNNER_TEMP/pitwall-cargo-ndk"
          export PATH="$tool_root/bin:$PATH"
          if [ ! -x "$tool_root/bin/cargo-ndk" ] || ! cargo ndk --version | grep -Eq '(^|[[:space:]])4\.1\.2$'; then
            cargo install cargo-ndk --version 4.1.2 --locked --root "$tool_root" --force
          fi
          cargo ndk --version | tee "$report/cargo-ndk-version.txt"
          grep -Eq '(^|[[:space:]])4\.1\.2$' "$report/cargo-ndk-version.txt"
          cargo ndk --platform 29 -t armeabi-v7a -t arm64-v8a -t x86 -t x86_64 -o "$report/abi" build --locked --release --lib
          echo "PITWALL_G0_JNI_LIB_DIR=$report/abi" >> "$GITHUB_ENV"
          cp Cargo.lock "$report/Cargo.lock"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            lib="$report/abi/$abi/libpitwall_g0.so"
            test -s "$lib"
            readelf -h -l -n "$lib" > "$report/$abi-elf.txt"
            # Reject missing build IDs before expensive Gradle work.
            python3 ../../scripts/architecture_g0_build_id.py "$report/$abi-elf.txt" | tee "$report/$abi-prepackage-build-id.txt"
            if [[ "$abi" == arm64-v8a || "$abi" == x86_64 ]]; then
              python3 -c 'import sys; lines=open(sys.argv[1]).read().splitlines(); rows=[lines[i+1].split()[-1] for i,l in enumerate(lines) if l.strip().startswith("LOAD")]; assert rows and all(int(v,16)>=16384 for v in rows), rows' "$report/$abi-elf.txt"
            fi
          done

      - name: Retain Architecture G.0 host and ELF evidence
        if: always() && github.ref == 'refs/heads/feature/architecture-g-rust-stitching'
        uses: actions/upload-artifact@v4
        with:
          name: architecture-g0-host-abi
          path: ${{ runner.temp }}/pitwall-g0
          if-no-files-found: warn

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Report Google Cast overlay receiver capability
        run: |
          if [ -z "${PITWALL_CAST_RECEIVER_ID:-}" ]; then
            echo "::warning::No registered Google Cast layout receiver. Google Cast can show full overlays only with verified clear baked playback. Protected/native overlays need Pitwall Cast on Android TV."
            echo "Google Cast receiver: standard video-only receiver. Local Pitwall Cast provides protected native overlays." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Google Cast receiver ID configured. The browser layout receiver displays video geometry only; native timing overlays remain Pitwall Cast-only for protected streams." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up FFmpeg for HEVC fixtures
        timeout-minutes: 8
        run: |
          set -euo pipefail
          ffmpeg_ready() {
            command -v ffprobe >/dev/null &&
              ffmpeg -hide_banner -decoders | grep -w hevc >/dev/null &&
              ffmpeg -hide_banner -encoders | grep -w libx265 >/dev/null &&
              ffmpeg -hide_banner -filters | grep -w drawtext >/dev/null
          }
          if ! ffmpeg_ready; then
            ffmpeg_dir="$RUNNER_TEMP/pitwall-ffmpeg"
            mkdir -p "$ffmpeg_dir"
            archive="$ffmpeg_dir/ffmpeg.tar.xz"
            release=autobuild-2026-11-18-12-39
            asset=ffmpeg-n8.1.3-36-ge22a4510c9-linux64-gpl-8.1.tar.xz
            curl --fail --location --retry 2 --max-time 120 \
              "https://github.com/BtbN/FFmpeg-Builds/releases/download/$release/$asset" -o "$archive"
            printf '%s  %s\n' fce424851b0a982bdd4ac4e96f0e7b32cf29de999e54500676d41ad175ed0c79 "$archive" | sha256sum --check
            tar -xJf "$archive" -C "$ffmpeg_dir" --strip-components=1
            export PATH="$ffmpeg_dir/bin:$PATH"
            echo "$ffmpeg_dir/bin" >> "$GITHUB_PATH"
          fi
          ffmpeg_ready
          ffmpeg -version > "$RUNNER_TEMP/ffmpeg-version.txt"
          head -n 1 "$RUNNER_TEMP/ffmpeg-version.txt"

      - name: Verify the encoded full-scene HEVC sample
        run: python3 tools/validate_hevc_full_scene.py --output "$RUNNER_TEMP/pitwall-full-scene.mp4"

      - name: Validate physical FrameTimeline comparison tool
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Upload the full-scene playback sample
        uses: actions/upload-artifact@v4
        with:
          name: pitwall-full-scene-hevc
          path: ${{ runner.temp }}/pitwall-full-scene.mp4

      - name: Read actual runner image version
        id: runner_image
        run: echo "version=${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Restore pinned Kvazaar tool cache
        id: kvazaar_cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pitwall-kvazaar-tool
          key: pitwall-kvazaar-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.runner_image.outputs.version }}-c997f08c805bd7ec82233654e417e06fe7c83cba

      - name: Build Kvazaar HEVC encoder with tile support
        timeout-minutes: 15
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/pitwall-kvazaar-tool"
          mkdir -p "$tool_dir"
          if [ ! -x "$tool_dir/kvazaar" ] || ! "$tool_dir/kvazaar" --version; then
            source_dir="$RUNNER_TEMP/kvazaar"
            git init "$source_dir"
          git -C "$source_dir" fetch --depth 1 https://github.com/ultravideo/kvazaar.git c997f08c805bd7ec82233654e417e06fe7c83cba
          git -C "$source_dir" checkout --detach FETCH_HEAD
          cmake -S "$source_dir" -B "$source_dir/ci-build" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DGIT_SUBMODULE=OFF
          cmake --build "$source_dir/ci-build" --target kvazaar-bin --parallel 2
            install -m 755 "$source_dir/src/kvazaar" "$tool_dir/kvazaar"
          fi
          "$tool_dir/kvazaar" --version
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Generate and validate synthetic HEVC feed pair
        run: |
          FIXTURE_DIR="$RUNNER_TEMP/apexview-hevc-fixtures"
          mkdir -p "$FIXTURE_DIR"
          python3 tools/generate_hevc_fixtures.py --output-dir "$FIXTURE_DIR"
          echo "APEXVIEW_HEVC_FIXTURE_DIR=$FIXTURE_DIR" >> "$GITHUB_ENV"

      - name: Generate genuine synthetic HEVC tile feeds
        run: |
          TILE_FIXTURE_DIR="$RUNNER_TEMP/apexview-hevc-tile-fixtures"
          mkdir -p "$TILE_FIXTURE_DIR"
          python3 tools/generate_hevc_tile_fixtures.py --output-dir "$TILE_FIXTURE_DIR"
          echo "APEXVIEW_HEVC_TILE_FIXTURE_DIR=$TILE_FIXTURE_DIR" >> "$GITHUB_ENV"

      - name: Generate four-tile 2x2 HEVC feeds and one-decoder sample
        run: |
          TILE_FIXTURE_DIR="$RUNNER_TEMP/apexview-hevc-tile-fixtures"
          python3 tools/generate_hevc_tile_2x2_fixtures.py --output-dir "$TILE_FIXTURE_DIR"
          echo "APEXVIEW_HEVC_TILE_FIXTURE_DIR=$TILE_FIXTURE_DIR" >> "$GITHUB_ENV"

      - name: Validate full-scene receiver protocol and JavaScript
        run: |
          node tools/test_cast_receiver.mjs
          node tools/test_cast_layout_receiver.mjs
          node --check web/cast/receiver.mjs
          python3 tools/package_cast_receiver.py --output-dir "$RUNNER_TEMP/pitwall-cast-receiver"
          node --check app/src/main/assets/cast/receiver.mjs

      - name: Configure persistent APK signing
        id: apk_signing
        env:
          APK_SIGNING_KEYSTORE_BASE64: ${{ secrets.APK_SIGNING_KEYSTORE_BASE64 }}
          APK_SIGNING_STORE_PASSWORD: ${{ secrets.APK_SIGNING_STORE_PASSWORD }}
          APK_SIGNING_KEY_ALIAS: ${{ secrets.APK_SIGNING_KEY_ALIAS }}
          APK_SIGNING_KEY_PASSWORD: ${{ secrets.APK_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APK_SIGNING_KEYSTORE_BASE64 APK_SIGNING_STORE_PASSWORD APK_SIGNING_KEY_ALIAS APK_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "APK_SIGNING_READY=false" >> "$GITHUB_ENV"
              echo "::warning::Missing repository Actions secret: $name. Tests and compilation will run, but no distributable APK will be uploaded."
              echo "Add the four APK_SIGNING_* repository secrets, then dispatch this workflow to create an updateable APK." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/apexview-update-key.p12"
          printf '%s' "$APK_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          cat > keystore.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$APK_SIGNING_STORE_PASSWORD
          keyAlias=$APK_SIGNING_KEY_ALIAS
          keyPassword=$APK_SIGNING_KEY_PASSWORD
          EOF
          echo "APK_SIGNING_READY=true" >> "$GITHUB_ENV"
          echo "Persistent APK signing key configured." >> "$GITHUB_STEP_SUMMARY"

      - name: Freeze build timestamp across Gradle invocations
        run: echo "PITWALL_BUILT_AT=$(LC_ALL=C date -u '+%b %-d, %H:%M')" >> "$GITHUB_ENV"

      - name: Run unit tests, including Kotlin analysis of real synthetic feeds
        run: |
          set +e
          OUTPUT_PARAMETER_DIR="$RUNNER_TEMP/apexview-hevc-output-parameters"
          mkdir -p "$OUTPUT_PARAMETER_DIR"
          export APEXVIEW_HEVC_OUTPUT_PARAMETER_DIR="$OUTPUT_PARAMETER_DIR"
          if [ -n "${PITWALL_G0_FIXTURE_DIR:-}" ]; then
            export PITWALL_G0_CMAF_DIR="$RUNNER_TEMP/pitwall-g0/cmaf"
            export PITWALL_G0_SLICE_DIR="$RUNNER_TEMP/pitwall-g0/slices"
            export PITWALL_GB_CMAF_INPUT_DIR="$RUNNER_TEMP/pitwall-g0/gb-input"
            mkdir -p "$PITWALL_G0_CMAF_DIR" "$PITWALL_G0_SLICE_DIR" "$PITWALL_GB_CMAF_INPUT_DIR"
            echo "PITWALL_GB_CMAF_INPUT_DIR=$PITWALL_GB_CMAF_INPUT_DIR" >> "$GITHUB_ENV"
          fi
          echo "APEXVIEW_HEVC_OUTPUT_PARAMETER_DIR=$OUTPUT_PARAMETER_DIR" >> "$GITHUB_ENV"
          chmod +x ./gradlew
          ./gradlew --daemon --no-build-cache testDebugUnitTest :macrobenchmark:compileDebugKotlin :macrobenchmark:compileBenchmarkKotlin
          TEST_STATUS=$?
          if [ "$TEST_STATUS" -ne 0 ]; then
            echo "::group::Detailed JVM unit-test failures"
            python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          for path in glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"):
              root = ET.parse(path).getroot()
              for case in root.findall(".//testcase"):
                  failure = case.find("failure")
                  error = case.find("error")
                  issue = failure if failure is not None else error
                  if issue is not None:
                      print(f"FAILED: {case.get('classname')}.{case.get('name')}")
                      print(issue.get("message", ""))
                      print(issue.text or "")
          PY
            echo "::endgroup::"
          fi
          exit "$TEST_STATUS"

      - name: Compare native clear CMAF writer with exact JVM fixture bytes
        if: github.ref == 'refs/heads/feature/architecture-g-rust-stitching'
        run: |
          set -euo pipefail
          cd native/architecture-g
          target/release/cmaf_bench "$RUNNER_TEMP/pitwall-g0/cmaf" | tee "$RUNNER_TEMP/pitwall-g0/cmaf-host.txt"
          g++ -std=c++17 -O3 -Wall -Wextra -Werror cmaf_control.cpp -o "$RUNNER_TEMP/pitwall-g0/cmaf-control"
          "$RUNNER_TEMP/pitwall-g0/cmaf-control" "$RUNNER_TEMP/pitwall-g0/cmaf" | tee "$RUNNER_TEMP/pitwall-g0/cmaf-cpp.txt"
          target/release/slice_bench "$RUNNER_TEMP/pitwall-g0/slices" | tee "$RUNNER_TEMP/pitwall-g0/slice-host.txt"

      - name: Independently decode generated output parameter sets and re-identified feeds
        run: |
          python3 tools/validate_hevc_output_parameters.py \
            --source-dir "$RUNNER_TEMP/apexview-hevc-fixtures" \
            --tile-dir "$RUNNER_TEMP/apexview-hevc-tile-fixtures" \
            --output-dir "$RUNNER_TEMP/apexview-hevc-output-parameters"


      - name: Independently decode Tizen-style 2x1 composition and compare source pixels
        run: |
          python3 tools/validate_hevc_tizen_grid_composer.py \
            --fixture-dir "$RUNNER_TEMP/apexview-hevc-fixtures" \
            --output-dir "$RUNNER_TEMP/apexview-hevc-output-parameters"

      # This repository must sign every distributable APK with the same private key. Do not
      # fall back to the ephemeral debug.keystore on a hosted runner: Android will reject updates.
      - name: Independently decode clear HEVC CMAF init and media fragments
        run: |
          python3 tools/validate_hevc_clear_cmaf.py \
            --fixture-dir "$RUNNER_TEMP/apexview-hevc-tile-fixtures" \
            --output-dir "$RUNNER_TEMP/apexview-hevc-output-parameters"

      - name: Independently decode Tizen-style CMAF grid composition and compare hstack pixels
        run: |
          python3 tools/validate_hevc_cmaf_grid.py \
            --tile-dir "$RUNNER_TEMP/apexview-hevc-tile-fixtures" \
            --fixture-dir "$RUNNER_TEMP/apexview-hevc-fixtures" \
            --output-dir "$RUNNER_TEMP/apexview-hevc-output-parameters"

      - name: Verify exact Rust 2-feed clear CMAF and independently decode its output
        if: github.ref == 'refs/heads/feature/architecture-g-rust-stitching'
        run: |
          set -euo pipefail
          native/architecture-g/target/release/gb_clear_grid \
            "$PITWALL_GB_CMAF_INPUT_DIR" "$RUNNER_TEMP/pitwall-g0/slices" \
            "$RUNNER_TEMP/apexview-hevc-output-parameters"
          python3 tools/validate_hevc_rust_gb_grid.py \
            --fixture-dir "$RUNNER_TEMP/apexview-hevc-fixtures" \
            --tile-dir "$RUNNER_TEMP/apexview-hevc-tile-fixtures" \
            --output-dir "$RUNNER_TEMP/apexview-hevc-output-parameters"
          cp "$RUNNER_TEMP/apexview-hevc-output-parameters/gb_clear_job.bin" \
             "$RUNNER_TEMP/apexview-hevc-output-parameters/gb_clear_expected.bin" \
             "$RUNNER_TEMP/apexview-hevc-tile-fixtures/"

      - name: Stage composed clear CMAF for Media3 device instrumentation
        run: |
          set -euo pipefail
          TILE_FIXTURE_DIR="$RUNNER_TEMP/apexview-hevc-tile-fixtures"
          OUTPUT_PARAMETER_DIR="$RUNNER_TEMP/apexview-hevc-output-parameters"
          test -s "$OUTPUT_PARAMETER_DIR/hevc_tizen_cmaf_grid.mp4"
          test -s "$OUTPUT_PARAMETER_DIR/hevc_tizen_cmaf_grid.mpd"
          cp "$OUTPUT_PARAMETER_DIR/hevc_tizen_cmaf_grid.mp4" "$TILE_FIXTURE_DIR/hevc_tizen_cmaf_grid.mp4"
          ls -lh "$TILE_FIXTURE_DIR/hevc_tizen_cmaf_grid.mp4"

      - name: Assemble debug APK
        id: assemble_apks
        if: success()
        run: |
          chmod +x ./gradlew
          ./gradlew --daemon --no-build-cache :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleBenchmark :macrobenchmark:assembleBenchmark
          ./gradlew --stop

      - name: Download exact Build 843 signed baseline for G.0 upgrade
        if: github.ref == 'refs/heads/feature/architecture-g-rust-stitching'
        uses: actions/download-artifact@v4
        with:
          name: apexview-custom-debug-apk
          run-id: 45441485463
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pitwall-g0-baseline

      - name: Verify G.0 signed native APK and build-ID-matched symbols
        if: github.ref == 'refs/heads/feature/architecture-g-rust-stitching'
        run: |
          set -euo pipefail
          test "${APK_SIGNING_READY:-false}" = true
          mapfile -t baseline_apks < <(find "$RUNNER_TEMP/pitwall-g0-baseline" -type f -name '*.apk')
          test "${#baseline_apks[@]}" -eq 1
          baseline="${baseline_apks[0]}"
          bash scripts/verify_architecture_g0_apk.sh app/build/outputs/apk/debug/app-debug.apk "$baseline" "$RUNNER_TEMP/pitwall-g0"
          echo "PITWALL_G0_BASELINE_APK=$baseline" >> "$GITHUB_ENV"

      - name: Retain G.0 APK and native symbol evidence
        if: always() && github.ref == 'refs/heads/feature/architecture-g-rust-stitching'
        uses: actions/upload-artifact@v4
        with:
          name: architecture-g0-apk-symbols
          path: ${{ runner.temp }}/pitwall-g0
          if-no-files-found: error

      - name: Encrypt exact-source APKs for parallel test jobs (not distributable)
        id: stage_g0
        if: github.ref == 'refs/heads/feature/architecture-g-rust-stitching'
        env:
          STAGING_KEY_MATERIAL: ${{ secrets.APK_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          name="g0-encrypted-stage-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 scripts/architecture_g0_stage.py pack "$name" "$RUNNER_TEMP/g0-stage.gpg" --baseline "$PITWALL_G0_BASELINE_APK"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted internal test bundle
        if: github.ref == 'refs/heads/feature/architecture-g-rust-stitching'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage_g0.outputs.name }}
          path: ${{ runner.temp }}/g0-stage.gpg
          if-no-files-found: error
          retention-days: 14

      # This runner may not expose /dev/kvm (nested virtualization is not guaranteed).
      # Do not fail an otherwise successful APK build before the tests even start.
      # Emulator Runner's 'auto' uses KVM when accessible and TCG otherwise.
      - name: Select Android emulator acceleration
        if: github.ref != 'refs/heads/feature/architecture-g-rust-stitching' && steps.assemble_apks.outcome == 'success'
        run: |
          set -eu
          if [ -c /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm || true
          fi
          if [ -c /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo 'RENDERNODE_EMULATOR_ACCEL=KVM' >> "$GITHUB_ENV"
            echo 'Android instrumentation: KVM acceleration available.' >> "$GITHUB_STEP_SUMMARY"
          else
            # Emulator 37.3+ requires explicit opt-in for software CPU emulation.
            echo 'ANDROID_I_WANT_MY_TCG=yes' >> "$GITHUB_ENV"
            echo 'RENDERNODE_EMULATOR_ACCEL=TCG' >> "$GITHUB_ENV"
            echo 'Android instrumentation: software TCG fallback, not a GPU performance benchmark.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Execute native RenderNode recording and replay instrumentation
        if: github.ref != 'refs/heads/feature/architecture-g-rust-stitching' && steps.assemble_apks.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # RenderNode is available from API 29. Use the smallest supported
          # platform to make unaccelerated emulation on hosted Linux viable.
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          disable-linux-hw-accel: auto
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -no-metrics
          # Emulator runner passes 'script' to /bin/sh -c; keep it one command.
          script: bash scripts/run_rendernode_instrumentation.sh

      - name: Execute Android 12 mutual TLS and key migration instrumentation
        if: github.ref != 'refs/heads/feature/architecture-g-rust-stitching' && success() && steps.assemble_apks.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          heap-size: 256M
          disable-animations: true
          disable-linux-hw-accel: auto
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -no-metrics
          script: bash scripts/run_rendernode_instrumentation.sh tls-only

      - name: Execute Android 16 mutual TLS and key migration instrumentation
        if: github.ref != 'refs/heads/feature/architecture-g-rust-stitching' && success() && steps.assemble_apks.outcome == 'success'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 3072M
          heap-size: 256M
          disable-animations: true
          disable-linux-hw-accel: auto
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -no-metrics
          script: bash scripts/run_rendernode_instrumentation.sh tls-only

      - name: Upload native RenderNode instrumentation report
        if: always() && github.ref != 'refs/heads/feature/architecture-g-rust-stitching'
        uses: actions/upload-artifact@v4
        with:
          name: pitwall-rendernode-instrumentation-report
          path: |
            ${{ runner.temp }}/pitwall-rendernode-instrumentation.txt
            ${{ runner.temp }}/pitwall-tls-api-*-instrumentation.txt
            ${{ runner.temp }}/pitwall-g0-api-*-instrumentation.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload debug APK
        if: github.ref != 'refs/heads/feature/architecture-g-rust-stitching' && success() && steps.assemble_apks.outcome == 'success' && env.APK_SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apexview-custom-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload temporary POC debug APK for device proof
        if: github.ref != 'refs/heads/feature/architecture-g-rust-stitching' && success() && steps.assemble_apks.outcome == 'success' && env.APK_SIGNING_READY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apexview-hevc-single-decoder-base-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # A physical benchmark needs BOTH a non-debuggable target and the runner APK.
      # Upload both from the same exact-source CI run, never treat the debug app
      # as a valid Macrobenchmark target.
      - name: Upload non-debuggable benchmark target APK
        if: github.ref != 'refs/heads/feature/architecture-g-rust-stitching' && success() && steps.assemble_apks.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pitwall-benchmark-target-apk
          path: app/build/outputs/apk/benchmark/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload physical-device FrameTimingMetric benchmark APK
        if: github.ref != 'refs/heads/feature/architecture-g-rust-stitching' && success() && steps.assemble_apks.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pitwall-macrobenchmark-instrumentation
          path: macrobenchmark/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload single-decoder instrumentation APK
        if: github.ref != 'refs/heads/feature/architecture-g-rust-stitching' && success() && steps.assemble_apks.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: apexview-hevc-single-decoder-instrumentation
          path: app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload HEVC output parameter validation evidence
        if: always() && steps.assemble_apks.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: apexview-hevc-output-parameter-validation
          path: |
            ${{ runner.temp }}/apexview-hevc-output-parameters/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Cast layout receiver for HTTPS hosting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitwall-cast-layout-receiver
          path: ${{ runner.temp }}/pitwall-cast-receiver/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apexview-custom-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14

  g0_emulator:
    name: G.0 Android API ${{ matrix.api }} instrumentation
    needs: build
    if: ${{ github.ref == 'refs/heads/feature/architecture-g-rust-stitching' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - api: 29
            ram: 2048M
            mode: full
          - api: 31
            ram: 3072M
            mode: tls-only
          - api: 36
            ram: 3072M
            mode: tls-only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Download exact build's encrypted internal test bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.stage_name }}
          path: ${{ runner.temp }}/g0-stage
      - name: Restore exact APKs and check manifest
        env:
          STAGING_KEY_MATERIAL: ${{ secrets.APK_SIGNING_KEYSTORE_BASE64 }}
          STAGE_NAME: ${{ needs.build.outputs.stage_name }}
        run: |
          set -euo pipefail
          python3 scripts/architecture_g0_stage.py unpack "$STAGE_NAME" "$RUNNER_TEMP/g0-stage/g0-stage.gpg"
          echo "PITWALL_G0_BASELINE_APK=$GITHUB_WORKSPACE/g0-baseline.apk" >> "$GITHUB_ENV"
      - name: Select Android emulator acceleration
        run: |
          set -eu
          if [ -c /dev/kvm ]; then sudo chmod a+rw /dev/kvm || true; fi
          if [ -c /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo 'RENDERNODE_EMULATOR_ACCEL=KVM' >> "$GITHUB_ENV"
          else
            echo 'ANDROID_I_WANT_MY_TCG=yes' >> "$GITHUB_ENV"
            echo 'RENDERNODE_EMULATOR_ACCEL=TCG' >> "$GITHUB_ENV"
          fi
      - name: Execute mandatory exact-source Android instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: ${{ matrix.ram }}
          heap-size: 256M
          disable-animations: true
          disable-linux-hw-accel: auto
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -no-metrics
          script: bash scripts/run_rendernode_instrumentation.sh ${{ matrix.mode }}
      - name: Retain per-API instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g0-instrumentation-api-${{ matrix.api }}
          path: |
            ${{ runner.temp }}/pitwall-rendernode-instrumentation.txt
            ${{ runner.temp }}/pitwall-tls-api-*-instrumentation.txt
            ${{ runner.temp }}/pitwall-g0-api-*-instrumentation.txt
            ${{ runner.temp }}/pitwall-surface-scene-instrumentation.txt
            ${{ runner.temp }}/pitwall-texture-scene-instrumentation.txt
            ${{ runner.temp }}/pitwall-baked-cast-instrumentation.txt
            ${{ runner.temp }}/pitwall-archive-delivery-instrumentation.txt
          if-no-files-found: warn
          retention-days: 14

  g0_publish:
    name: G.0 final APK publication gate
    needs: [build, g0_emulator]
    if: ${{ always() && github.ref == 'refs/heads/feature/architecture-g-rust-stitching' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download all available instrumentation evidence
        if: ${{ needs.g0_emulator.result == 'success' || needs.g0_emulator.result == 'failure' }}
        uses: actions/download-artifact@v4
        with:
          pattern: g0-instrumentation-api-*
          path: ${{ runner.temp }}/g0-instrumentation-reports
      - name: Retain combined instrumentation report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pitwall-rendernode-instrumentation-report
          path: ${{ runner.temp }}/g0-instrumentation-reports
          if-no-files-found: warn
          retention-days: 14
      - name: Require all three emulator jobs to succeed
        if: ${{ always() }}
        env:
          MATRIX_RESULT: ${{ needs.g0_emulator.result }}
        run: |
          test "$MATRIX_RESULT" = success
      - name: Download approved exact-source encrypted bundle
        if: ${{ success() && needs.g0_emulator.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.stage_name }}
          path: ${{ runner.temp }}/g0-stage
      - name: Restore verified APKs only after all gates
        if: ${{ success() && needs.g0_emulator.result == 'success' }}
        env:
          STAGING_KEY_MATERIAL: ${{ secrets.APK_SIGNING_KEYSTORE_BASE64 }}
          STAGE_NAME: ${{ needs.build.outputs.stage_name }}
        run: python3 scripts/architecture_g0_stage.py unpack "$STAGE_NAME" "$RUNNER_TEMP/g0-stage/g0-stage.gpg"
      - name: Upload debug APK
        if: ${{ success() && needs.g0_emulator.result == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: apexview-custom-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload non-debuggable benchmark target APK
        if: ${{ success() && needs.g0_emulator.result == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: pitwall-benchmark-target-apk
          path: app/build/outputs/apk/benchmark/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload physical-device FrameTimingMetric benchmark APK
        if: ${{ success() && needs.g0_emulator.result == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: pitwall-macrobenchmark-instrumentation
          path: macrobenchmark/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload single-decoder instrumentation APK
        if: ${{ success() && needs.g0_emulator.result == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: apexview-hevc-single-decoder-instrumentation
          path: app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14
