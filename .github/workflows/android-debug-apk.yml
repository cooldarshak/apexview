name: Android debug APK

on:
  push:
    branches:
      - feature/playback-speed-tv-controls
      - feature/timing-tower-map-menu
      - fix/tv-timing-map-and-dpad-sliders
      - customtiledview
      - feature/hevc-stitching-poc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 35 SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Install FFmpeg tools for synthetic HEVC fixtures
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -hide_banner -encoders 2>&1 | grep -q libx265

      - name: Generate and validate synthetic HEVC feed pair
        run: python3 tools/generate_hevc_fixtures.py

      # This repository must sign every distributable APK with the same private key. Do not
      # fall back to the ephemeral debug.keystore on a hosted runner: Android will reject updates.
      - name: Configure persistent APK signing
        id: apk_signing
        env:
          APK_SIGNING_KEYSTORE_BASE64: ${{ secrets.APK_SIGNING_KEYSTORE_BASE64 }}
          APK_SIGNING_STORE_PASSWORD: ${{ secrets.APK_SIGNING_STORE_PASSWORD }}
          APK_SIGNING_KEY_ALIAS: ${{ secrets.APK_SIGNING_KEY_ALIAS }}
          APK_SIGNING_KEY_PASSWORD: ${{ secrets.APK_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APK_SIGNING_KEYSTORE_BASE64 APK_SIGNING_STORE_PASSWORD APK_SIGNING_KEY_ALIAS APK_SIGNING_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "APK_SIGNING_READY=false" >> "$GITHUB_ENV"
              echo "::warning::Missing repository Actions secret: $name. Tests and compilation will run, but no distributable APK will be uploaded."
              echo "Add the four APK_SIGNING_* repository secrets, then dispatch this workflow to create an updateable APK." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/apexview-update-key.p12"
          printf '%s' "$APK_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          cat > keystore.properties <<EOF
          storeFile=$KEYSTORE_PATH
          storePassword=$APK_SIGNING_STORE_PASSWORD
          keyAlias=$APK_SIGNING_KEY_ALIAS
          keyPassword=$APK_SIGNING_KEY_PASSWORD
          EOF
          echo "APK_SIGNING_READY=true" >> "$GITHUB_ENV"
          echo "Persistent APK signing key configured." >> "$GITHUB_STEP_SUMMARY"

      - name: Assemble debug APK
        if: always() && !cancelled()
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        if: success() && env.APK_SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: apexview-custom-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apexview-custom-unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14
